<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D3B58" />
      <stop offset="100%" stop-color="#122538" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A5B8" />
      <stop offset="100%" stop-color="#E48AA0" />
    </linearGradient>
  </defs>

  <!-- Premium rounded squircle badge for contrast in both dark & light browser tabs -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="28" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Mamata Fertility Center Emblem: Mother, Womb & Embryo curves -->
  <g transform="translate(6, 4)" stroke="url(#pinkGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Base foundation curve -->
    <path d="M 28 100 L 88 100" />
    
    <!-- Outer left maternal curve -->
    <path d="M 32 98 C 45 98, 60 88, 60 70 C 60 54, 48 54, 43 66 C 39 76, 54 94, 88 100" />
    
    <!-- Center ascending life petal -->
    <path d="M 48 90 C 62 74, 76 46, 76 26 C 76 15, 63 15, 57 32 C 52 48, 65 84, 90 100" />
    
    <!-- Right upright oval embryo / womb loop -->
    <path d="M 88 100 C 97 82, 112 46, 112 26 C 112 10, 86 10, 86 36 C 86 62, 95 88, 104 100" />
  </g>

  <!-- Small radiant spark indicator of life -->
  <circle cx="96" cy="24" r="3" fill="#FFFFFF" opacity="0.9" />
</svg>
